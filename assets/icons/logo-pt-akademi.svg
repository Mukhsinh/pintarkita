<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 85" width="100%" height="100%">
  <defs>
    <linearGradient id="apBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066CC"/>
      <stop offset="100%" stop-color="#004080"/>
    </linearGradient>
    <linearGradient id="apGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C853"/>
      <stop offset="100%" stop-color="#009624"/>
    </linearGradient>
    <linearGradient id="apCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B0FF"/>
      <stop offset="100%" stop-color="#0077C2"/>
    </linearGradient>
    <filter id="apShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- AP Monogram Symbol from Company Profile PDF -->
  <g transform="translate(10, 10)" filter="url(#apShadow)">
    <!-- Slanted Left Stem (Blue) -->
    <path d="M22,12 L38,12 L16,58 L0,58 Z" fill="url(#apBlueGrad)"/>
    
    <!-- Top Right Curved Loop of P (Blue) -->
    <path d="M32,12 C48,12 62,20 62,34 C62,45 52,54 38,54 L24,54 L30,42 L38,42 C44,42 49,38 49,33 C49,27 44,23 37,23 L28,23 Z" fill="url(#apBlueGrad)"/>

    <!-- Green Dynamic Accent Ribbon forming A crossbar and P loop interior -->
    <path d="M12,42 L28,42 C36,42 42,46 42,50 C42,56 34,60 22,60 C15,60 8,57 4,52 Z" fill="url(#apGreenGrad)"/>
    
    <!-- Small Red/Orange Center Dot Indicator as in company profile -->
    <circle cx="36" cy="32" r="5" fill="#FF5252"/>
  </g>

  <!-- Typography: PT. Akademi Profesional Indonesia -->
  <g transform="translate(85, 20)">
    <text x="0" y="24" font-family="'Plus Jakarta Sans', 'Outfit', sans-serif" font-weight="800" font-size="24" fill="#0A2540" letter-spacing="-0.3">PT. Akademi</text>
    <text x="0" y="44" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="600" font-size="12.5" fill="#425466" letter-spacing="1">PROFESIONAL INDONESIA</text>
  </g>
</svg>
