<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="blueGradUC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF"/>
      <stop offset="50%" stop-color="#0052D4"/>
      <stop offset="100%" stop-color="#0A3F97"/>
    </linearGradient>
    <linearGradient id="orangeGradUC" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5E00"/>
      <stop offset="50%" stop-color="#FF8A00"/>
      <stop offset="100%" stop-color="#FFA800"/>
    </linearGradient>
    <filter id="shadowUC" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#003580" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Modern Calculator & Clinical Unit Cost Tablet in Royal Blue -->
  <rect x="42" y="24" width="116" height="152" rx="24" fill="url(#blueGradUC)" filter="url(#shadowUC)"/>
  
  <!-- Digital Screen Display -->
  <rect x="58" y="42" width="84" height="34" rx="10" fill="#FFFFFF" opacity="0.95"/>
  <!-- Currency / Real Cost Trend Symbol inside Screen -->
  <text x="68" y="66" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="20" fill="#0A3F97">Rp</text>
  <circle cx="126" cy="56" r="4" fill="#00D2FE"/>
  <circle cx="114" cy="62" r="3" fill="#FF8A00"/>

  <!-- Calculator Keypad Nodes -->
  <circle cx="70" cy="98" r="9" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="100" cy="98" r="9" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="130" cy="98" r="9" fill="#FFFFFF" opacity="0.9"/>
  
  <circle cx="70" cy="124" r="9" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="100" cy="124" r="9" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="130" cy="124" r="9" fill="#FFFFFF" opacity="0.9"/>

  <circle cx="70" cy="150" r="9" fill="#FFFFFF" opacity="0.9"/>
  <!-- Key Action Equal Node in Orange -->
  <rect x="91" y="141" width="48" height="18" rx="9" fill="url(#orangeGradUC)"/>

  <!-- Dynamic Orange Orbit Ring (Cost Driver & Efficiency) -->
  <path d="M145,28 C175,55 178,110 152,155 C146,165 136,174 126,180 C140,165 152,135 150,105 C148,70 125,45 105,35 C120,30 135,27 145,28 Z" 
        fill="url(#orangeGradUC)"/>
</svg>
