<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="blueGradJP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0052D4"/>
      <stop offset="100%" stop-color="#0A3F97"/>
    </linearGradient>
    <linearGradient id="orangeGradJP" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5E00"/>
      <stop offset="50%" stop-color="#FF8A00"/>
      <stop offset="100%" stop-color="#FFA800"/>
    </linearGradient>
    <filter id="shadowJP" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#003580" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Circular Head -->
  <circle cx="120" cy="40" r="24" fill="url(#blueGradJP)" filter="url(#shadowJP)"/>

  <!-- Body Silhouette in Blue -->
  <path d="M60,165 C55,145 60,110 85,90 C100,78 125,78 140,88 C135,100 120,115 100,125 C80,135 65,150 60,165 Z" 
        fill="url(#blueGradJP)" filter="url(#shadowJP)"/>

  <!-- Left Supporting Curve -->
  <path d="M50,150 C45,115 65,85 95,75 C80,95 72,120 75,150 Z" 
        fill="url(#blueGradJP)"/>

  <!-- Dynamic Golden Orange Swoosh across shoulder -->
  <path d="M60,155 C70,120 100,90 145,68 C160,62 170,68 155,85 C125,115 90,140 60,155 Z" 
        fill="url(#orangeGradJP)"/>

  <!-- Ascending KPI / Incentive Performance Bars -->
  <rect x="95" y="115" width="14" height="45" rx="5" fill="url(#blueGradJP)"/>
  <rect x="117" y="98" width="14" height="62" rx="5" fill="url(#orangeGradJP)"/>
  <rect x="139" y="80" width="14" height="80" rx="5" fill="url(#blueGradJP)"/>
</svg>
