<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="blueGradKLINIK" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0052D4"/>
      <stop offset="100%" stop-color="#0A3F97"/>
    </linearGradient>
    <linearGradient id="orangeGradKLINIK" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5E00"/>
      <stop offset="50%" stop-color="#FF8A00"/>
      <stop offset="100%" stop-color="#FFA800"/>
    </linearGradient>
    <filter id="shadowKLINIK" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#003580" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Clinic Hexagonal House Structure in Blue -->
  <path d="M100,25 L160,65 C165,68 168,74 168,80 L168,145 C168,155 160,165 150,165 L60,165 C45,165 32,152 32,137 L32,80 C32,74 35,68 40,65 Z" 
        fill="none" stroke="url(#blueGradKLINIK)" stroke-width="18" stroke-linejoin="round" stroke-linecap="round" filter="url(#shadowKLINIK)"/>

  <!-- Medical Cross (+) inside house -->
  <rect x="88" y="70" width="24" height="60" rx="6" fill="url(#blueGradKLINIK)"/>
  <rect x="70" y="88" width="60" height="24" rx="6" fill="url(#blueGradKLINIK)"/>

  <!-- Golden Orange Healing / Growth Leaf wrapping around bottom right -->
  <path d="M95,170 C130,170 170,145 175,100 C175,100 165,145 130,152 C105,158 90,140 85,120 C82,145 88,170 95,170 Z" 
        fill="url(#orangeGradKLINIK)"/>
  
  <path d="M105,162 C135,162 165,138 172,102 C168,135 140,152 118,152 C100,152 92,142 88,128 C86,145 95,162 105,162 Z" 
        fill="url(#orangeGradKLINIK)"/>
</svg>
