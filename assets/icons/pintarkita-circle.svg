<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="circBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF"/>
      <stop offset="50%" stop-color="#0052D4"/>
      <stop offset="100%" stop-color="#0A3F97"/>
    </linearGradient>
    <linearGradient id="circOrange" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5E00"/>
      <stop offset="50%" stop-color="#FF8A00"/>
      <stop offset="100%" stop-color="#FFA800"/>
    </linearGradient>
    <filter id="cShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#003580" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer Circle Frame -->
  <circle cx="50" cy="50" r="48" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <circle cx="50" cy="50" r="42" fill="url(#circBlue)" filter="url(#cShadow)"/>

  <!-- Orange Fresh Swoop -->
  <path d="M50,12 C72,12 88,28 88,50 C88,68 74,84 54,87 C64,78 72,65 72,50 C72,33 60,18 50,12 Z" 
        fill="url(#circOrange)"/>

  <!-- Stylized White Monogram & Smart Star -->
  <path d="M36,30 L52,30 C62,30 68,36 68,43 C68,50 62,56 52,56 L44,56 L44,70 L36,70 Z" 
        fill="#FFFFFF"/>
  <circle cx="52" cy="43" r="5" fill="url(#circBlue)"/>
  <circle cx="65" cy="31" r="5" fill="#FFA800"/>
</svg>
