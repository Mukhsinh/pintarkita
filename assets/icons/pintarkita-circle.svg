<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="nexusBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF"/>
      <stop offset="50%" stop-color="#0052D4"/>
      <stop offset="100%" stop-color="#0A3F97"/>
    </linearGradient>
    <linearGradient id="nexusOrange" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5E00"/>
      <stop offset="50%" stop-color="#FF8A00"/>
      <stop offset="100%" stop-color="#FFA800"/>
    </linearGradient>
    <linearGradient id="nexusCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>
    <filter id="nexusShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#003580" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Outer Bezel -->
  <circle cx="50" cy="50" r="48" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  
  <!-- Vibrant Blue Medical Nexus Circle -->
  <circle cx="50" cy="50" r="42" fill="url(#nexusBlue)" filter="url(#nexusShadow)"/>

  <!-- Dynamic Golden Orbital Wing (Hospital Synergy & Agility) -->
  <path d="M50,14 C70,14 86,30 86,50 C86,66 74,80 57,85 C67,78 74,65 74,50 C74,34 64,20 50,14 Z" 
        fill="url(#nexusOrange)"/>

  <!-- Modern 4-Point Smart Medical Cross / Care Diamond (NO LETTER P) -->
  <!-- Top Petal -->
  <path d="M50,23 C52.5,31 55,36 63,38 C55,40 52.5,45 50,53 C47.5,45 45,40 37,38 C45,36 47.5,31 50,23 Z" 
        fill="#FFFFFF"/>

  <!-- Interlocking Smart Health Node in Vibrant Cyan/White -->
  <path d="M50,47 C52,53 54,57 60,59 C54,61 52,65 50,71 C48,65 46,61 40,59 C46,57 48,53 50,47 Z" 
        fill="url(#nexusCyan)"/>

  <!-- Central Star Spark Node -->
  <circle cx="50" cy="46" r="3.2" fill="#FFFFFF"/>
  <circle cx="68" cy="30" r="4" fill="#FFA800"/>
  <circle cx="32" cy="62" r="2.8" fill="#00F2FE"/>
</svg>
