      <stop offset="0%" stop-color="#0052D4"/>
      <stop offset="100%" stop-color="#0A3F97"/>
    </linearGradient>
    <linearGradient id="orangeGradMR" x1="0%" y1="0%" x2="100%" y2="100%">
