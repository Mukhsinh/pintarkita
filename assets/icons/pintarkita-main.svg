<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 395 95" width="100%" height="100%">
  <defs>
    <linearGradient id="pkCircleBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF"/>
      <stop offset="50%" stop-color="#0052D4"/>
      <stop offset="100%" stop-color="#0A3F97"/>
    </linearGradient>
    <linearGradient id="pkCircleOrange" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5E00"/>
      <stop offset="50%" stop-color="#FF8A00"/>
      <stop offset="100%" stop-color="#FFA800"/>
    </linearGradient>
    <filter id="pkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0052D4" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Fresh Circular Badge Icon -->
  <g transform="translate(10, 10)" filter="url(#pkGlow)">
    <!-- Outer Soft Ring -->
    <circle cx="37" cy="37" r="36" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.8"/>
    
    <!-- Inner Vibrant Gradient Circle -->
    <circle cx="37" cy="37" r="31" fill="url(#pkCircleBlue)"/>

    <!-- Dynamic Curved Amber/Orange Wing (Fresh & Bulat) -->
    <path d="M37,8 C53,8 66,21 66,37 C66,53 53,66 37,66 C44,59 53,48 53,37 C53,24 44,13 37,8 Z" 
          fill="url(#pkCircleOrange)"/>

    <!-- Modern Stylized 'P' & Smart Star Spark in White -->
    <path d="M27,22 L38,22 C46,22 51,26 51,32 C51,38 46,42 38,42 L33,42 L33,52 L27,52 Z" 
          fill="#FFFFFF"/>
    <circle cx="37" cy="32" r="3.5" fill="url(#pkCircleBlue)"/>

    <!-- Fresh Inner Growth Leaf/Cross in White -->
    <circle cx="47" cy="23" r="4" fill="#FFA800"/>
  </g>

  <!-- Typography -->
  <g transform="translate(98, 14)">
    <text x="0" y="32" font-family="'Plus Jakarta Sans', 'Outfit', sans-serif" font-weight="800" font-size="33" letter-spacing="-0.5" fill="#0A3F97">PINTAR<tspan fill="#FF6A00">KITA</tspan></text>
    <rect x="0" y="42" width="285" height="2" fill="url(#pkCircleOrange)"/>
    <!-- Pill tag for high visibility -->
    <rect x="0" y="49" width="285" height="22" rx="6" fill="#EEF4FF"/>
    <text x="8" y="65" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="11.5" letter-spacing="0.8" fill="#0A3F97">LAYANAN PT. AKADEMI PROFESIONAL INDONESIA</text>
  </g>
</svg>
