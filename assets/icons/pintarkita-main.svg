<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 100" width="100%" height="100%">
  <defs>
    <linearGradient id="mainBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF"/>
      <stop offset="50%" stop-color="#0052D4"/>
      <stop offset="100%" stop-color="#0A3F97"/>
    </linearGradient>
    <linearGradient id="mainOrange" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5E00"/>
      <stop offset="50%" stop-color="#FF8A00"/>
      <stop offset="100%" stop-color="#FFA800"/>
    </linearGradient>
    <linearGradient id="mainCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>
    <filter id="mainGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0052D4" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Fresh Circular Badge Icon (NO LETTER P) -->
  <g transform="translate(10, 10)" filter="url(#mainGlow)">
    <!-- Outer Soft Ring -->
    <circle cx="39" cy="39" r="38" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.8"/>
    
    <!-- Inner Vibrant Gradient Circle -->
    <circle cx="39" cy="39" r="33" fill="url(#mainBlue)"/>

    <!-- Dynamic Curved Amber/Orange Wing (Synergy & Care) -->
    <path d="M39,9 C56,9 70,23 70,39 C70,53 60,65 46,69 C54,63 60,52 60,39 C60,26 51,15 39,9 Z" 
          fill="url(#mainOrange)"/>

    <!-- Modern 4-Point Smart Medical Cross / Care Diamond (NO LETTER P) -->
    <path d="M39,18 C41,25 43,29 50,31 C43,33 41,37 39,44 C37,37 35,33 28,31 C35,29 37,25 39,18 Z" 
          fill="#FFFFFF"/>

    <!-- Dynamic Lower Intelligence Node in Cyan -->
    <path d="M39,37 C41,42 43,45 47,47 C43,49 41,52 39,57 C37,52 35,49 31,47 C35,45 37,42 39,37 Z" 
          fill="url(#mainCyan)"/>

    <!-- Central & Accent Star Spark Nodes -->
    <circle cx="39" cy="36" r="2.8" fill="#FFFFFF"/>
    <circle cx="53" cy="22" r="3.4" fill="#FFA800"/>
    <circle cx="25" cy="48" r="2.4" fill="#00F2FE"/>
  </g>

  <!-- Typography -->
  <g transform="translate(100, 12)">
    <!-- PINTARKITA Title -->
    <text x="0" y="36" font-family="'Plus Jakarta Sans', 'Outfit', sans-serif" font-weight="800" font-size="36" letter-spacing="-0.5" fill="#0A3F97">PINTAR<tspan fill="#FF6A00">KITA</tspan></text>
    
    <!-- Divider Gradient Accent Line -->
    <rect x="0" y="46" width="335" height="2.5" rx="1.25" fill="url(#mainOrange)"/>
    
    <!-- Subtitle Pill: PT. Akademi Profesional Indonesia (Clear, Larger, Never Cutoff) -->
    <rect x="0" y="54" width="335" height="26" rx="7" fill="#EEF4FF" stroke="#D0E1FD" stroke-width="0.8"/>
    <text x="12" y="72" font-family="'Plus Jakarta Sans', 'Outfit', system-ui, sans-serif" font-weight="800" font-size="13.5" letter-spacing="0.5" fill="#0A3F97">PT. Akademi Profesional Indonesia</text>
  </g>
</svg>
